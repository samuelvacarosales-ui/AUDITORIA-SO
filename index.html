<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Anexo SO</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anexo SO">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#e8541e">
<style>
:root{
  --orange:#f2711c; --red:#e6402a; --dark:#1e2430; --bg:#f4f5f7; --card:#fff;
  --ok:#008c3c; --bad:#dc0000; --na:#000; --pte:#000; --warn:#c87800; --none:#787878;
  --border:#e2e5ea; --text:#1e2430; --soft:#6b7280;
  --sb: env(safe-area-inset-bottom,0px); --st: env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,sans-serif;overscroll-behavior-y:none;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
.hidden{display:none !important;}

.topbar{background:linear-gradient(135deg,var(--orange),var(--red));color:#fff;padding:calc(12px + var(--st)) 14px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.topbar .t{flex:1;min-width:0;}
.topbar h1{font-size:17px;margin:0;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .sub{font-size:12px;opacity:.92;}
.icon-btn{background:rgba(255,255,255,.2);border:none;color:#fff;width:38px;height:38px;border-radius:10px;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-btn:active{background:rgba(255,255,255,.35);}

.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(96px + var(--sb));}
.pad{padding:14px;}

/* home */
.big-btn{display:block;background:var(--card);border:1.5px dashed var(--orange);border-radius:14px;padding:22px 16px;text-align:center;color:var(--red);font-weight:700;font-size:16px;margin:14px;}
.big-btn small{display:block;font-weight:400;color:var(--soft);font-size:13px;margin-top:4px;}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);font-weight:700;margin:16px 4px 8px;}
.audit-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
.audit-card .info{flex:1;min-width:0;}
.audit-card .nm{font-weight:700;font-size:15px;}
.audit-card .meta{font-size:12.5px;color:var(--soft);margin-top:2px;}
.audit-card .del{color:var(--bad);font-size:20px;padding:6px 8px;}
.empty{text-align:center;color:var(--soft);padding:26px 14px;font-size:14px;}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;margin-right:4px;color:#fff;}

/* cabecera auditoría */
.hcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin:12px;}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0;}
.fld.full{grid-column:1/-1;}
.fld label{font-size:10.5px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.fld .ro{font-size:15px;font-weight:700;padding:3px 0;word-break:break-word;}
.fld input{border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:14.5px;background:#fbfbfc;color:var(--text);}
.linkbtn{display:inline-block;margin-top:10px;color:var(--red);font-weight:700;font-size:13.5px;border:1px solid var(--border);border-radius:10px;padding:8px 12px;background:#fff8f5;}

/* resumen y filtros */
.stats{display:flex;gap:8px;padding:0 12px;}
.stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 4px;text-align:center;}
.stat b{display:block;font-size:19px;}
.stat span{font-size:10.5px;color:var(--soft);font-weight:700;text-transform:uppercase;}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:7px;padding:10px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.chip{flex-shrink:0;border:1.5px solid var(--border);background:#fff;border-radius:20px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--soft);}
.chip.on{background:var(--dark);border-color:var(--dark);color:#fff;}

/* áreas y preguntas */
.area{margin:4px 12px 0;}
.area-h{background:var(--dark);color:#fff;padding:10px 13px;border-radius:12px;font-weight:700;font-size:13.5px;margin-top:10px;}
.ap-t{font-size:11.5px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.03em;margin:11px 4px 6px;}
.q{background:var(--card);border:1px solid var(--border);border-left:6px solid var(--none);border-radius:13px;padding:11px 12px;margin-bottom:9px;}
.q.s-SI{border-left-color:var(--ok);} .q.s-NO{border-left-color:var(--bad);} .q.s-NA{border-left-color:var(--na);} .q.s-PTE{border-left-color:var(--pte);}
.q-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.q-num{font-size:12px;font-weight:800;color:var(--soft);}
.q-badge{font-size:12px;font-weight:800;}
.s-SI .q-badge{color:var(--ok);} .s-NO .q-badge{color:var(--bad);} .s-NA .q-badge{color:var(--na);} .s-PTE .q-badge{color:var(--pte);} .s-none .q-badge{color:var(--none);}
.q-text{font-size:14px;font-weight:700;line-height:1.35;color:#c96a00;margin-bottom:8px;}
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.th{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--border);flex-shrink:0;}
.th img{width:100%;height:100%;object-fit:cover;display:block;}
.th .sz{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-weight:800;padding:1px 5px;border-top-right-radius:6px;}
.add{width:64px;height:64px;border-radius:10px;border:1.5px dashed var(--orange);color:var(--orange);display:flex;align-items:center;justify-content:center;font-size:26px;background:#fff8f3;flex-shrink:0;}
.cartel{border-left-color:var(--orange);}

/* barra inferior */
.bottombar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:10px 14px calc(10px + var(--sb));display:flex;gap:10px;z-index:20;}
.btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;text-align:center;}
.btn-p{background:linear-gradient(135deg,var(--orange),var(--red));color:#fff;}
.btn-s{background:#eef0f3;color:var(--text);}
.btn:disabled{opacity:.45;}

/* vista previa */
.pv-wrap{padding:12px;}
.pv-page{background:#fff;border:1px solid var(--border);border-radius:6px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);font-size:11px;}
.pv-hdr,.pv-q{width:100%;border-collapse:collapse;table-layout:fixed;}
.pv-hdr th,.pv-hdr td,.pv-q th,.pv-q td{border:1px solid #000;padding:4px 6px;text-align:left;vertical-align:top;font-size:11px;}
.pv-hdr th{width:30%;}
.pv-q{margin-top:14px;} .pv-q .pv-l{width:30%;}
.pv-text{color:#f7941d;font-weight:800;overflow-wrap:anywhere;font-size:10px !important;}
.pv-cartel-title{text-align:center;font-weight:800;margin:14px 0 8px;}
.pv-cartel{text-align:center;} .pv-cartel img{max-width:100%;margin-bottom:6px;}
.pv-ph{text-align:center;padding:6px !important;}
.pv-ph img{display:inline-block;margin:3px;vertical-align:top;height:auto;}
.pv-cartel img{display:inline-block;margin:3px;height:auto;}
.pv-note{font-size:12px;color:var(--soft);padding:0 14px 6px;}

/* editor de fotos */
.modal{position:fixed;inset:0;background:#0b0b0f;z-index:100;display:flex;flex-direction:column;}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + var(--st)) 14px 10px;color:#fff;font-weight:700;}
.m-head button{background:none;border:none;color:#fff;font-size:16px;font-weight:700;padding:6px 4px;}
.m-head .strong{color:#ffb27a;}
.stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0;}
.stage canvas{touch-action:none;display:block;}
.ed-info{color:#c9ccd3;font-size:12.5px;text-align:center;padding:6px;}
.ed-tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:6px 12px calc(14px + var(--sb));}
.ed-tools button{background:#2a2f3a;color:#fff;border:none;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;}
.seg{display:flex;background:#2a2f3a;border-radius:10px;overflow:hidden;}
.seg button{border-radius:0;background:transparent;padding:10px 12px;}
.seg button.on{background:var(--orange);}
.ed-del{background:#5a2020 !important;}

.overlay{position:fixed;inset:0;background:rgba(10,10,14,.7);z-index:150;display:flex;align-items:center;justify-content:center;}
.box{background:#fff;border-radius:16px;padding:24px 26px;text-align:center;max-width:280px;font-size:14px;font-weight:700;}
.spin{width:34px;height:34px;border:3px solid #eee;border-top-color:var(--orange);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
#toast{position:fixed;left:50%;bottom:calc(100px + var(--sb));transform:translateX(-50%);background:#1e2430;color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center;}
#toast.show{opacity:1;}

.hbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.hbtns .linkbtn{margin-top:0;}
.linkbtn.main{background:linear-gradient(135deg,var(--orange),var(--red));color:#fff;border-color:transparent;}
.hint{font-size:12.5px;color:var(--soft);margin-top:10px;line-height:1.35;}
.bank-modal{position:fixed;inset:0;background:var(--bg);z-index:110;display:flex;flex-direction:column;}
.bank-head{background:linear-gradient(135deg,var(--orange),var(--red));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--st)) 14px 12px;font-weight:800;font-size:16px;}
.bank-head button{background:rgba(255,255,255,.2);border:none;color:#fff;font-weight:800;font-size:14px;border-radius:10px;padding:9px 14px;}
.bank-grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start;}
.bank-empty{grid-column:1/-1;text-align:center;color:var(--soft);font-size:14px;padding:40px 18px;line-height:1.4;}
.bk{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:3px solid transparent;background:#ddd;}
.bk img{width:100%;height:100%;object-fit:cover;display:block;}
.bk.sel{border-color:var(--orange);}
.bk-n{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;background:var(--orange);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}
.bk-n.off{background:rgba(0,0,0,.25);}
.bk-x{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;}
.bk-used{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.65);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-top-right-radius:8px;}
.bank-foot{display:flex;gap:10px;padding:10px 14px calc(10px + var(--sb));background:#fff;border-top:1px solid var(--border);}
.bank-foot label.btn{display:block;cursor:pointer;}
.sheet{position:fixed;inset:0;background:rgba(10,10,14,.55);z-index:120;display:flex;align-items:flex-end;}
.sheet-box{width:100%;background:#fff;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + var(--sb));display:flex;flex-direction:column;gap:9px;}
.sheet-box .btn{flex:none;text-align:left;padding:15px 16px;font-size:15.5px;}
.sheet-box .btn small{display:block;font-weight:500;font-size:12.5px;opacity:.85;margin-top:2px;}
input[type=file]{display:none;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <button class="icon-btn hidden" id="backBtn">‹</button>
    <div class="t"><h1 id="topTitle">Anexo SO</h1><div class="sub" id="topSub">Repsol · Anexo fotográfico</div></div>
    <button class="icon-btn hidden" id="settingsBtn">⚙</button>
  </div>

  <!-- INICIO -->
  <div class="screen" id="s-home">
    <label class="big-btn" for="fileNew">+ Cargar Excel rellenado<small>El que descargas de Repsol, ya con SÍ / NO / N/A</small></label>
    <input type="file" id="fileNew" accept=".xlsx">
    <div class="pad" style="padding-top:0">
      <div class="sec-title">Informes en curso</div><div id="ongoing"></div>
      <div class="sec-title hidden" id="finTitle">Finalizados</div><div id="finished"></div>
    </div>
  </div>

  <!-- AUDITORÍA -->
  <div class="screen hidden" id="s-audit">
    <div class="hcard" id="hcard"></div>
    <div class="stats" id="stats"></div>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </div>

  <!-- VISTA PREVIA -->
  <div class="screen hidden" id="s-preview">
    <div class="pv-note" id="pvNote"></div>
    <div class="pv-wrap" id="pvBody"></div>
  </div>

  <!-- AJUSTES -->
  <div class="screen hidden" id="s-settings">
    <div class="hcard"><div class="hgrid">
      <div class="fld full"><label>Nombre del auditor</label><input id="setAuditor" type="text"></div>
    </div></div>
    <div class="pad"><button class="btn btn-p" id="saveSet" style="width:100%">Guardar ajustes</button></div>
  </div>

  <div class="bottombar hidden" id="bar-audit">
    <button class="btn btn-p" id="previewBtn">Vista previa del informe</button>
  </div>
  <div class="bottombar hidden" id="bar-preview">
    <button class="btn btn-s" id="pvOpen" disabled>Abrir PDF</button>
    <button class="btn btn-p" id="pvSave" disabled>Guardar PDF</button>
  </div>
</div>

<!-- EDITOR DE FOTO -->
<div class="modal hidden" id="editor">
  <div class="m-head"><button id="edCancel">Cancelar</button><span id="edTitle">Ajustar foto</span><button id="edSave" class="strong">Guardar</button></div>
  <div class="stage" id="edStage"><canvas id="edCanvas"></canvas></div>
  <div class="ed-info" id="edInfo"></div>
  <div class="ed-tools">
    <button id="edRotL">⟲ 90°</button><button id="edRotR">⟳ 90°</button><button id="edReset">Todo</button>
    <div class="seg" id="edSize"><button data-s="S">Pequeña</button><button data-s="M">Media</button><button data-s="L">Grande</button></div>
    <button id="edDel" class="ed-del hidden">Eliminar</button>
  </div>
</div>

<!-- FOTOS DE LA ESTACIÓN -->
<div class="bank-modal hidden" id="bankModal">
  <div class="bank-head"><span id="bankTitle">Fotos de la estación</span><button id="bankClose">Cerrar</button></div>
  <div class="bank-grid" id="bankGrid"></div>
  <div class="bank-foot">
    <label class="btn btn-s" for="fileBank">+ Añadir fotos</label>
    <button class="btn btn-p hidden" id="bankUse" disabled>Elige fotos</button>
  </div>
</div>
<!-- HOJA DEL "+" -->
<div class="sheet hidden" id="addSheet"><div class="sheet-box">
  <button class="btn btn-p" id="sheetBank">Elegir de las fotos de la estación<small><span id="sheetBankN">0</span> fotos guardadas</small></button>
  <button class="btn btn-s" id="sheetNew">Hacer foto o elegir de la fototeca</button>
  <button class="btn btn-s" id="sheetCancel" style="text-align:center">Cancelar</button>
</div></div>
<input type="file" id="fileBank" accept="image/*" multiple>
<input type="file" id="filePhoto" accept="image/*" multiple>
<input type="file" id="fileReload" accept=".xlsx">

<div class="overlay hidden" id="busy"><div class="box"><div class="spin"></div><div id="busyMsg">Procesando…</div></div></div>
<div id="toast"></div>

<script src="xlsx.full.min.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
